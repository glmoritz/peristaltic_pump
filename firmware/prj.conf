# ---- Console, log, shell ----------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
# Logs go to the console backend (UART, or stdout on native_sim) from boot on.
# The shell's own log backend would print every line a second time, and it
# starts too late to show the boot messages.
CONFIG_SHELL_LOG_BACKEND=n
# `cmnd` takes the whole payload as words.
CONFIG_SHELL_ARGC_MAX=32

# ---- Persistent tunables, q̂, counters, network settings (settings on NVS) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Floats: printf %f in the shell, logs and JSON (no FPU; rates are low) --
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Threads ----------------------------------------------------------------
# main = the control loop (priority 0); the network thread runs at 10, the
# storage work queue at 13, the shell at the lowest priority.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# A stuck control loop resets the chip (main.c).
CONFIG_TASK_WDT=y

# ---- Network: MQTT + Home Assistant, NTP ------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_SNTP=y
CONFIG_HWINFO=y
CONFIG_WIFI_PROV=y
CONFIG_WIFI_PROV_NAME="Condpump"
