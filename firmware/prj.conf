# ---- Console, log, shell ----------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
# Logs go to the console backend (UART, or stdout on native_sim) from boot on.
# The shell's own log backend would print every line a second time, and it
# starts too late to show the boot messages.
CONFIG_SHELL_LOG_BACKEND=n

# ---- Persistent tunables, q̂ and counters (settings on NVS) ------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Floats: printf %f in the shell and logs (the C3 has no FPU; 10 Hz is fine)
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=4096
