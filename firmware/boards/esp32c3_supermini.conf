# Stepper: TMC2209 enable pin + CPU step/dir controller on a hardware timer.
CONFIG_GPIO=y
CONFIG_STEPPER=y
CONFIG_COUNTER=y

# Hardware fallback for the task watchdog (wdt0).
CONFIG_WATCHDOG=y

# Logs on the USB console from boot (prj.conf turns the shell log backend off;
# this backend defaults to off whenever the serial shell is enabled).
CONFIG_LOG_BACKEND_UART=y

# ---- Wi-Fi (station + provisioning AP, modules/wifi_prov) -------------------
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_NM=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
# The ESP32 Wi-Fi driver starts the DHCPv4 client itself on association.
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_CONFIG_AUTO_INIT=n
# wifi_prov follows IPv6 (SLAAC) too, and the home LAN has it.
CONFIG_NET_IPV6=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_DNS_RECONFIGURE_CLEANUP=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10

# Shell over the network (port 23) as well as USB: no cable needed once the
# pump is in the wall. Unauthenticated: LAN only (README).
CONFIG_SHELL_BACKEND_TELNET=y
