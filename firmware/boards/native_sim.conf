# Simulated reservoir and motor (CONFIG_PUMP_SIM defaults to y here).
# Flash simulator backs the settings; pass --flash=<file> to keep them.
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Network = the host's, through offloaded sockets: no TAP, no setup. Point
# MqttHost at any broker the host can reach.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_IPV6=n

CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_PICOLIBC=y
CONFIG_THREAD_NAME=y
